<!-- @dsCard group="Type" viewport="700x240" name="Scale" subtitle="Light hero lines, small tracked-out caps for nav/labels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--nx-space-900);font-family:var(--nx-font-sans);color:#fff;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.h{color:var(--nx-text-body);font-size:34px;font-weight:var(--nx-weight-light);letter-spacing:var(--nx-track-tight);line-height:1.25}
.nav{color:var(--nx-text-body);font-size:14px;letter-spacing:.025em}
.cap{color:#fff;font-size:12px;font-weight:var(--nx-weight-bold);letter-spacing:var(--nx-track-wider)}
.foot{color:var(--nx-text-dim);font-size:12px}
.tag{color:var(--nx-text-dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}</style></head><body>
<div><span class="tag">Hero · 300 light</span><div class="h">slipped beyond our reach :/</div></div>
<div><span class="tag">Nav · 14px</span><div class="nav">Domain&nbsp;&nbsp;&nbsp;Servers&nbsp;&nbsp;&nbsp;Cloud&nbsp;&nbsp;&nbsp;Managed</div></div>
<div><span class="tag">Label · 700 caps 0.15em</span><div class="cap">JOIN FOR EXCLUSIVE DEALS</div></div>
<div><span class="tag">Footer link · 12px /50</span><div class="foot">Managed Instances</div></div>
</body></html>
