      - {id: vibe_pack/S6_context_manifest/q2, q: 本章给单次装载量规定的上限或预算是多少？}
      - {id: vibe_pack/S6_context_manifest/q3, q: 本章如何让装载清单与具体任务的对应关系可查？}
    S7_verification:
