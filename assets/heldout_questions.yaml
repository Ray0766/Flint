      - {id: vibe_pack/S7_verification/q2, q: 按本章，验证失败时的回退动作是什么？}
      - {id: vibe_pack/S7_verification/q3, q: 本章规定测试需覆盖到什么程度才算通过？}
    S8_progress_ledger:
