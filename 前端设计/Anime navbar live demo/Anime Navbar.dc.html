<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0b0c10; font-family: 'Manrope', sans-serif; }
  a { color: rgba(255,255,255,0.7); text-decoration: none; }
  a:hover { color: #ffffff; }
  @keyframes navIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes glowPulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.03); } }
  @keyframes shine { 0% { transform: translateX(-100%); } 50% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
  @keyframes mBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes mWiggle { 0% { transform: scale(1) rotate(0deg); } 30% { transform: scale(1.1) rotate(-5deg); } 60% { transform: scale(1.1) rotate(5deg); } 100% { transform: scale(1) rotate(0deg); } }
  @keyframes mBlink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.2); } }
  @keyframes mTailBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
  @keyframes mTailHop { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes sparklePop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</helmet>
<div style="min-height: 100vh; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34,211,238,0.08), transparent), #0b0c10; color: #ffffff;">
  <div style="position: fixed; top: 0; left: 0; right: 0; z-index: 9999; display: flex; justify-content: center; padding-top: 72px;">
    <nav ref="{{ navRef }}" style="display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px; border-radius: 9999px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); position: relative; animation: navIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;">
      <div style="position: absolute; top: 0; bottom: 0; left: {{ glowLeft }}px; width: {{ glowWidth }}px; opacity: {{ glowOpacity }}; border-radius: 9999px; animation: glowPulse 2s ease-in-out infinite; transition: left 0.45s cubic-bezier(0.3,1.3,0.5,1), width 0.45s cubic-bezier(0.3,1.3,0.5,1);">
        <div style="position: absolute; inset: 0; background: {{ g25 }}; border-radius: 9999px; filter: blur(6px);"></div>
        <div style="position: absolute; inset: -4px; background: {{ g20 }}; border-radius: 9999px; filter: blur(14px);"></div>
        <div style="position: absolute; inset: -8px; background: {{ g15 }}; border-radius: 9999px; filter: blur(26px);"></div>
        <div style="position: absolute; inset: -12px; background: {{ g05 }}; border-radius: 9999px; filter: blur(40px);"></div>
        <div style="position: absolute; inset: 0; border-radius: 9999px; overflow: hidden;">
          <div style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent, {{ gShine }}, transparent); animation: shine 3s ease-in-out infinite;"></div>
        </div>
      </div>
      <a href="#" data-tab="Home" onClick="{{ onTabClick }}" onMouseEnter="{{ onTabEnter }}" onMouseLeave="{{ onTabLeave }}" style="position: relative; z-index: 1; cursor: pointer; font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 9999px; color: {{ homeColor }}; transition: color 0.3s, background 0.3s;" style-hover="background: rgba(255,255,255,0.08); color: #ffffff;">
        <span style="display: {{ labelDisplay }};">Home</span>
        <span style="display: {{ iconDisplay }}; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
      </a>
      <a href="#" data-tab="Convert" onClick="{{ onTabClick }}" onMouseEnter="{{ onTabEnter }}" onMouseLeave="{{ onTabLeave }}" style="position: relative; z-index: 1; cursor: pointer; font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 9999px; color: {{ convertColor }}; transition: color 0.3s, background 0.3s;" style-hover="background: rgba(255,255,255,0.08); color: #ffffff;">
        <span style="display: {{ labelDisplay }};">Convert</span>
        <span style="display: {{ iconDisplay }}; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg></span>
      </a>
      <a href="#" data-tab="Pricing" onClick="{{ onTabClick }}" onMouseEnter="{{ onTabEnter }}" onMouseLeave="{{ onTabLeave }}" style="position: relative; z-index: 1; cursor: pointer; font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 9999px; color: {{ pricingColor }}; transition: color 0.3s, background 0.3s;" style-hover="background: rgba(255,255,255,0.08); color: #ffffff;">
        <span style="display: {{ labelDisplay }};">Pricing</span>
        <span style="display: {{ iconDisplay }}; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg></span>
      </a>
      <a href="#" data-tab="About" onClick="{{ onTabClick }}" onMouseEnter="{{ onTabEnter }}" onMouseLeave="{{ onTabLeave }}" style="position: relative; z-index: 1; cursor: pointer; font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 9999px; color: {{ aboutColor }}; transition: color 0.3s, background 0.3s;" style-hover="background: rgba(255,255,255,0.08); color: #ffffff;">
        <span style="display: {{ labelDisplay }};">About</span>
        <span style="display: {{ iconDisplay }}; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span>
      </a>
      <div style="position: absolute; top: -48px; left: {{ mascotLeft }}px; width: 48px; height: 48px; opacity: {{ mascotOpacity }}; pointer-events: none; transition: left 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;">
        <div style="position: absolute; left: 50%; top: 0; width: 40px; height: 40px; margin-left: -20px; background: #ffffff; border-radius: 50%; animation: {{ mascotAnim }}; z-index: 1;">
          <div style="position: absolute; left: 25%; top: 40%; width: 8px; height: 8px; background: #000000; border-radius: 50%; animation: {{ blinkAnim }};"></div>
          <div style="position: absolute; right: 25%; top: 40%; width: 8px; height: 8px; background: #000000; border-radius: 50%; animation: {{ blinkAnim }};"></div>
          <div style="position: absolute; left: 15%; top: 55%; width: 8px; height: 6px; background: #f9a8d4; border-radius: 9999px; opacity: {{ blushOpacity }}; transition: opacity 0.3s;"></div>
          <div style="position: absolute; right: 15%; top: 55%; width: 8px; height: 6px; background: #f9a8d4; border-radius: 9999px; opacity: {{ blushOpacity }}; transition: opacity 0.3s;"></div>
          <div style="position: absolute; left: 30%; top: 60%; width: 16px; height: 8px; border-bottom: 2px solid #000000; border-radius: 9999px; transform: {{ mouthTransform }}; transition: transform 0.2s;"></div>
          <sc-if value="{{ hovered }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: -4px; right: -4px; font-size: 10px; animation: sparklePop 0.2s ease-out both;">✨</div>
            <div style="position: absolute; top: -8px; left: 0; font-size: 10px; animation: sparklePop 0.2s ease-out 0.1s both;">✨</div>
          </sc-if>
        </div>
        <div style="position: absolute; bottom: -4px; left: 50%; width: 16px; height: 16px; margin-left: -8px; animation: {{ tailAnim }};">
          <div style="width: 100%; height: 100%; background: #ffffff; transform: rotate(45deg);"></div>
        </div>
      </div>
    </nav>
  </div>
  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 160px 24px 80px; box-sizing: border-box; gap: 20px;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: {{ accent }};">anime-navbar demo</div>
    <h1 style="margin: 0; font-size: 56px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; max-width: 640px; text-wrap: balance;">A navbar with a mascot that watches you.</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.6; color: rgba(255,255,255,0.55); max-width: 460px; text-wrap: pretty;">Hover a tab and it blinks, wiggles, and sparkles. Click a tab and it springs over to follow the active glow.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#22d3ee&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#22d3ee&quot;,&quot;#f472b6&quot;,&quot;#a78bfa&quot;,&quot;#fbbf24&quot;],&quot;section&quot;:&quot;Navbar&quot;},&quot;defaultActive&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Convert&quot;,&quot;Pricing&quot;,&quot;About&quot;],&quot;section&quot;:&quot;Navbar&quot;},&quot;mascot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navbar&quot;}}">
class Component extends DCLogic {
  state = { activeTab: null, hoveredTab: null, rects: null, isMobile: false };
  measure = () => {
    const nav = this.navEl;
    if (!nav) return;
    const rects = {};
    nav.querySelectorAll('a[data-tab]').forEach((el) => {
      rects[el.dataset.tab] = { left: el.offsetLeft, width: el.offsetWidth };
    });
    if (JSON.stringify(rects) !== JSON.stringify(this.state.rects)) this.setState({ rects });
  };
  checkMobile = () => {
    const isMobile = window.innerWidth < 768;
    if (isMobile !== this.state.isMobile) this.setState({ isMobile });
    this.measure();
  };
  componentDidMount() {
    window.addEventListener('resize', this.checkMobile);
    requestAnimationFrame(this.checkMobile);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.measure());
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.checkMobile);
  }
  componentDidUpdate(prevProps, prevState) {
    if (this.lastMeasuredIsMobile !== this.state.isMobile) {
      this.lastMeasuredIsMobile = this.state.isMobile;
      this.measure();
    }
    if (prevProps && prevProps.defaultActive !== this.props.defaultActive) this.setState({ activeTab: null });
  }
  hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#22d3ee';
    const showMascot = this.props.mascot ?? true;
    const active = this.state.activeTab ?? this.props.defaultActive ?? 'Home';
    const hovered = this.state.hoveredTab;
    const r = this.state.rects ? this.state.rects[active] : null;
    const col = (name) => (active === name ? '#ffffff' : 'rgba(255,255,255,0.7)');
    return {
      navRef: (el) => { this.navEl = el; },
      onTabClick: (e) => { e.preventDefault(); this.setState({ activeTab: e.currentTarget.dataset.tab }); },
      onTabEnter: (e) => this.setState({ hoveredTab: e.currentTarget.dataset.tab }),
      onTabLeave: () => this.setState({ hoveredTab: null }),
      glowLeft: r ? r.left : 0,
      glowWidth: r ? r.width : 0,
      glowOpacity: r ? 1 : 0,
      mascotLeft: r ? r.left + r.width / 2 - 24 : 0,
      mascotOpacity: r && showMascot ? 1 : 0,
      homeColor: col('Home'),
      convertColor: col('Convert'),
      pricingColor: col('Pricing'),
      aboutColor: col('About'),
      labelDisplay: this.state.isMobile ? 'none' : 'inline',
      iconDisplay: this.state.isMobile ? 'inline-flex' : 'none',
      hovered: !!hovered,
      mascotAnim: hovered ? 'mWiggle 0.5s ease-in-out' : 'mBob 2s ease-in-out infinite',
      blinkAnim: hovered ? 'mBlink 0.25s ease-in-out' : 'none',
      mouthTransform: hovered ? 'scaleY(1.5) translateY(-1px)' : 'none',
      tailAnim: hovered ? 'mTailHop 0.3s ease-in-out infinite alternate' : 'mTailBob 1s ease-in-out 0.5s infinite',
      blushOpacity: hovered ? 0.8 : 0.6,
      g25: this.hexA(accent, 0.25),
      g20: this.hexA(accent, 0.2),
      g15: this.hexA(accent, 0.15),
      g05: this.hexA(accent, 0.06),
      gShine: this.hexA(accent, 0.25),
      accent,
    };
  }
}
</script>
</body>
</html>
