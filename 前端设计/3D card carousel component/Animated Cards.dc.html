<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; }
    a { color: #ffffff; } a:hover { color: #cccccc; }
  </style>
</helmet>
<div style="position: relative; width: 100vw; height: 100vh; background: #000000; overflow: hidden;">
  <x-import component="App" from="./App.jsx" hint-size="100%,100%" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;"></x-import>
</div>
</x-dc>
</body>
</html>
