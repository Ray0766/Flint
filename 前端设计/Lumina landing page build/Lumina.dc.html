<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<x-dc>
<helmet>
<style>
@font-face {
  font-family: "Helvetica Regular";
  src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.eot");
  src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.eot?#iefix")format("embedded-opentype"),
  url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff2")format("woff2"),
  url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff")format("woff"),
  url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.ttf")format("truetype"),
  url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.svg#Helvetica Regular")format("svg");
}
html, body { margin: 0; padding: 0; background: #000; }
::selection { background: rgba(255,255,255,0.2); color: #fff; }
a { color: inherit; text-decoration: none; }
a:hover { color: #fff; }
@keyframes footer-in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
.liquid-glass {
  background: rgba(255, 255, 255, 0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
    rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
    rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
</style>
</helmet>
<main style="position: relative; width: 100%; min-height: 115vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; font-family: 'Helvetica Regular', Helvetica, Arial, sans-serif; background: #000; color: #fff;">

        </div>
        <div style="grid-column: span 7; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;">
          <div>
            <h3 style="margin: 0 0 16px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; font-weight: 500;">探索</h3>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px;">

              <li><a href="#" style="transition: color 0.2s;" style-hover="color: #fff;">加入我们</a></li>

            <a href="#" aria-label="YouTube" style="opacity: 0.7; display: inline-flex; transition: opacity 0.2s, color 0.2s;" style-hover="opacity: 1; color: #fff;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"></path><path d="m10 15 5-3-5-3z"></path></svg></a>
            <a href="#" aria-label="Instagram" style="opacity: 0.7; display: inline-flex; transition: opacity 0.2s, color 0.2s;" style-hover="opacity: 1; color: #fff;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg></a>
          </div>
        </div>
      </div>
    </footer>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showVideo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;overlayDim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:0.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showVideo: this.props.showVideo ?? true,
      overlayDim: this.props.overlayDim ?? 0
    };
  }
}
</script>
