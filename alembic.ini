# Alembic config (M1-003). ASCII only: alembic reads this file with the
# system locale codec (GBK on zh-CN Windows). Connection URL is NOT set here;
# migrations/env.py reads DATABASE_URL, defaulting to the compose dev stack
# (host port 55432, see .env.example).
[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
