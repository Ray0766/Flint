      - {id: vibe_pack/S2_invariants/q2, q: 本章说明这些不变量由什么手段强制执行？}
      - {id: vibe_pack/S2_invariants/q3, q: 两条不变量相互冲突时本章给的优先级是什么？}
    S3_contracts:
      - {id: vibe_pack/S3_contracts/q1, q: 本章指明不允许修改的是哪些内容？}
      - {id: vibe_pack/S3_contracts/q2, q: 按本章，类型或接口不够用时执行者该怎么办？}
      - {id: vibe_pack/S3_contracts/q3, q: 本章把契约的权威来源点名到哪个文件？}
    S4_decision_log:
      - {id: vibe_pack/S4_decision_log/q1, q: 本章为各条决策记录的被否决替代方案是什么？}
      - {id: vibe_pack/S4_decision_log/q2, q: 按本章，决策在什么条件下可被推翻？}
      - {id: vibe_pack/S4_decision_log/q3, q: 本章如何建立决策与其影响模块之间的对应关系？}
    S5_task_dag:
      - {id: vibe_pack/S5_task_dag/q1, q: 本章如何表达任务之间的前置依赖？}
      - {id: vibe_pack/S5_task_dag/q2, q: 本章指出的关键路径或最长链是哪条？}
      - {id: vibe_pack/S5_task_dag/q3, q: 本章为单个任务规定的完成判据落到什么可执行检查动作？}
    S6_context_manifest:
