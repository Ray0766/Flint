<!DOCTYPE html>

<x-dc>
<helmet>
<link rel="stylesheet" href="uploads/NEXOVA Design System/styles.css">

<style>

</helmet>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>

    return {
      navLinks: ["今日线索", "可行性判定", "深度报告", "如实原则", "定价", "关于"],

        { title: "原则", links: ["如实原则", "状态标记", "资料缺口", "复核机制"] },
        { title: "帮助", links: ["提交工单", "常见问题", "文档", "教程", "社区"] },
        { title: "关于", links: ["我们的故事", "团队", "新闻", "加入我们", "博客"] },
      ],
    };
  }
}
</script>
</body>
