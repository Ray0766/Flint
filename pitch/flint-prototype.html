<title>燧石 Flint · 产品原型</title>
<style>
:root{
  --ground:#EEF0F2; --surface:#FFFFFF; --raised:#F7F8F9; --sunken:#E4E8EB;
  --ink:#141C24; --ink-2:#3D4A57; --ink-3:#6B7785; --ink-4:#96A1AC;
  --line:#D6DCE1; --line-2:#E7EBEE;
  --accent:#1F4E8C; --accent-soft:#E6EDF6; --accent-ink:#173C6B; --on-accent:#FFFFFF;
  --vA:#A6392F; --vB:#9E7118; --vC:#2E7D6B; --vD:#64717F;
  --vA-bg:#F7E9E7; --vB-bg:#F7F0DF; --vC-bg:#E4F0EC; --vD-bg:#EAEDF0;
  --s1:#3E6FB0; --s2:#C2603C; --s3:#6A5AA8; --s4:#8C7A33;
  --ok:#2E7D6B; --warn:#9E7118; --stop:#A6392F;
  --shadow:0 1px 2px rgba(20,28,36,.06),0 8px 24px -16px rgba(20,28,36,.28);
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  --r:3px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0E1418; --surface:#151D23; --raised:#1B242B; --sunken:#0A1013;
    --ink:#E6EBEF; --ink-2:#B4C0CA; --ink-3:#8593A0; --ink-4:#5E6D7A;
    --line:#293540; --line-2:#1F2A32;
    --accent:#79A8E3; --accent-soft:#182838; --accent-ink:#A8C7EE; --on-accent:#0E1418;
    --vA:#E08076; --vB:#D6AE5A; --vC:#63BCA5; --vD:#93A1AD;
    --vA-bg:#2B1A18; --vB-bg:#2A2416; --vC-bg:#14261F; --vD-bg:#1B242B;
    --s1:#7BA6DC; --s2:#DE8F6C; --s3:#9E8FD4; --s4:#C0AA5C;
    --ok:#63BCA5; --warn:#D6AE5A; --stop:#E08076;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="light"]{
  --ground:#EEF0F2; --surface:#FFFFFF; --raised:#F7F8F9; --sunken:#E4E8EB;
  --ink:#141C24; --ink-2:#3D4A57; --ink-3:#6B7785; --ink-4:#96A1AC;
  --line:#D6DCE1; --line-2:#E7EBEE;
  --accent:#1F4E8C; --accent-soft:#E6EDF6; --accent-ink:#173C6B; --on-accent:#FFFFFF;
  --vA:#A6392F; --vB:#9E7118; --vC:#2E7D6B; --vD:#64717F;
  --vA-bg:#F7E9E7; --vB-bg:#F7F0DF; --vC-bg:#E4F0EC; --vD-bg:#EAEDF0;
  --s1:#3E6FB0; --s2:#C2603C; --s3:#6A5AA8; --s4:#8C7A33;
  --ok:#2E7D6B; --warn:#9E7118; --stop:#A6392F;
  --shadow:0 1px 2px rgba(20,28,36,.06),0 8px 24px -16px rgba(20,28,36,.28);
}
:root[data-theme="dark"]{
  --ground:#0E1418; --surface:#151D23; --raised:#1B242B; --sunken:#0A1013;
  --ink:#E6EBEF; --ink-2:#B4C0CA; --ink-3:#8593A0; --ink-4:#5E6D7A;
  --line:#293540; --line-2:#1F2A32;
  --accent:#79A8E3; --accent-soft:#182838; --accent-ink:#A8C7EE;
  --vA:#E08076; --vB:#D6AE5A; --vC:#63BCA5; --vD:#93A1AD;
  --vA-bg:#2B1A18; --vB-bg:#2A2416; --vC-bg:#14261F; --vD-bg:#1B242B;
  --s1:#7BA6DC; --s2:#DE8F6C; --s3:#9E8FD4; --s4:#C0AA5C;
  --ok:#63BCA5; --warn:#D6AE5A; --stop:#E08076;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:700}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--line-2)}
.mark{width:26px;height:26px;flex:none}
.brand b{font-size:16px;letter-spacing:.04em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.14em;display:block;margin-top:-2px}
.navgrp{padding:14px 10px 2px}
.navgrp>h4{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-4);
  font-weight:500;padding:0 8px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:var(--r);
  text-align:left;color:var(--ink-2);font-size:13.5px;transition:background .12s,color .12s}
.nav button i{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-4);
  min-width:22px;font-variant-numeric:tabular-nums}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav button[aria-current="true"] i{color:var(--accent)}
.railfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line-2);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-4);line-height:1.7}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 86%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 26px;height:52px}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{margin-left:auto}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--surface);padding:4px 10px;border-radius:var(--r);font-size:12.5px;color:var(--ink-2)}
.chipbtn:hover{border-color:var(--ink-4)}
.demochip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-4);
  border:1px dashed var(--line);padding:3px 8px;border-radius:var(--r)}
main{padding:26px 26px 80px;max-width:1240px}
.screen{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-4);margin-bottom:6px}
.h1{font-size:26px;line-height:1.25}
.h2{font-size:17px;margin-bottom:2px}
.lede{color:var(--ink-2);max-width:70ch;margin-top:6px}
.hdr{margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec{margin-top:26px}
.sec>h3{font-size:13px;letter-spacing:.02em;margin-bottom:10px;color:var(--ink-2);
  display:flex;align-items:center;gap:8px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--line-2)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;padding:2px 7px;border-radius:2px;border:1px solid var(--line);color:var(--ink-3)}
.tag.new{color:var(--s1);border-color:color-mix(in srgb,var(--s1) 40%,transparent);background:color-mix(in srgb,var(--s1) 8%,transparent)}
.tag.mom{color:var(--s2);border-color:color-mix(in srgb,var(--s2) 40%,transparent);background:color-mix(in srgb,var(--s2) 8%,transparent)}
.tag.rev{color:var(--s3);border-color:color-mix(in srgb,var(--s3) 40%,transparent);background:color-mix(in srgb,var(--s3) 8%,transparent)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.stop{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,transparent)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  padding:6px 13px;border-radius:var(--r);font-size:13px;color:var(--ink);transition:.12s}
.btn:hover{border-color:var(--ink-4);background:var(--raised)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-4);
  font-weight:500;padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-4);padding-top:3px}
.kv dd{margin:0}

/* 出处槽 */
.cite{font-family:var(--mono);font-size:10.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
  background:var(--accent-soft);padding:1px 5px;border-radius:2px;vertical-align:1px;transition:.12s}
.cite:hover{background:var(--accent);color:var(--surface)}
.cite[aria-expanded="true"]{background:var(--accent);color:var(--surface)}
.citebody{margin:8px 0 12px;border-left:2px solid var(--accent);background:var(--raised);
  padding:10px 14px;font-size:12.5px;color:var(--ink-2)}
.citebody b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink)}
.citebody q{display:block;margin:6px 0;color:var(--ink);border-left:2px solid var(--line);padding-left:10px}

/* 判定 */
.verdict{display:grid;grid-template-columns:120px 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vstamp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 10px;gap:2px}
.vstamp b{font-family:var(--mono);font-size:52px;line-height:1;font-weight:700}
.vstamp span{font-size:11.5px;letter-spacing:.05em}
.vbody{padding:16px 18px;background:var(--surface)}
.vC .vstamp{background:var(--vC-bg);color:var(--vC)}
.vA .vstamp{background:var(--vA-bg);color:var(--vA)}
.vB .vstamp{background:var(--vB-bg);color:var(--vB)}
.vD .vstamp{background:var(--vD-bg);color:var(--vD)}
.chain{display:flex;flex-direction:column;gap:1px;font-size:13px}
.chain .step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:9px 12px;
  background:var(--raised);border-left:2px solid var(--line)}
.chain .step.hit{background:var(--vC-bg);border-left-color:var(--vC)}
.chain .step.miss{opacity:.82}
.chain .mk{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink-4)}
.chain .step.hit .mk{color:var(--vC)}
.chain .why{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.cond{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.cond em{font-style:normal;font-family:var(--mono);font-size:12px;flex:none;width:14px}
.cond.y em{color:var(--ok)} .cond.n em{color:var(--stop)}

/* 卡片 */
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:.14s}
.hcard:hover{border-color:var(--ink-4);transform:translateY(-1px)}
.hcard .native{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.hcard .trans{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-top:1px}
.mt{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1px solid var(--line);
  padding:0 4px;border-radius:2px;color:var(--ink-4)}
.srcbars{display:flex;gap:3px;align-items:flex-end;height:26px}
.srcbars i{flex:1;border-radius:1px 1px 0 0;display:block}
.srcleg{display:flex;gap:10px;font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.srcleg span{display:flex;align-items:center;gap:3px}
.srcleg s{width:6px;height:6px;border-radius:1px;text-decoration:none}
.heat{display:flex;align-items:baseline;gap:6px}
.heat b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.heat span{font-size:11px;color:var(--ink-3)}

/* 图谱 */
.canvas{position:relative;height:400px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;
  background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:18px 18px}
.node{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:7px 11px;font-size:12.5px;box-shadow:var(--shadow);cursor:grab;max-width:170px}
.node.k-hot{border-left:3px solid var(--s2)}
.node.k-topic{border-left:3px solid var(--accent)}
.node.k-ev{border-left:3px solid var(--s1)}
.node small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.06em}
.edgelabel{position:absolute;transform:translate(-50%,-50%);background:var(--ground);
  border:1px dashed var(--line);padding:3px 8px;font-size:11.5px;color:var(--ink-2);max-width:210px;border-radius:2px}

/* 报告 */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 36px;max-width:78ch}
.doc h2{font-size:19px;margin:26px 0 10px}
.doc h2:first-child{margin-top:0}
.doc p{margin:0 0 12px;line-height:1.85}
.disclaimer{background:var(--sunken);border-left:2px solid var(--ink-4);padding:10px 14px;
  font-size:12px;color:var(--ink-2);margin-bottom:18px}
.blk{position:relative;padding:2px 0}
.blk.prot{background:var(--raised);border-left:2px solid var(--ink-4);padding:10px 14px;margin:0 0 12px -16px}
.blk.rev{background:var(--vB-bg);border-left:2px solid var(--vB);padding:10px 14px;margin:0 0 12px -16px}
.blk.block{background:var(--vA-bg);border-left:2px solid var(--vA);padding:10px 14px;margin:0 0 12px -16px}
.blkflag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;display:block;margin-bottom:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line-2);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.metric{background:var(--surface);padding:12px 14px}
.metric b{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.metric span{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.metric.bad b{color:var(--stop)} .metric.good b{color:var(--ok)} .metric.warn b{color:var(--warn)}
.bar{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* 任务卡 */
.task{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px 15px}
.task header{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.task header b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
.task header span{font-weight:600;font-size:14px}
code,pre{font-family:var(--mono);font-size:11.5px}
pre{background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r);
  padding:10px 12px;overflow-x:auto;margin:6px 0;line-height:1.6}
code.inl{background:var(--sunken);padding:1px 5px;border-radius:2px;font-size:11.5px}

/* 步骤流 */
.steps{display:flex;flex-direction:column;gap:1px}
.step2{display:grid;grid-template-columns:18px 1fr auto auto;gap:12px;align-items:center;
  padding:10px 14px;background:var(--surface);border:1px solid var(--line-2);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);justify-self:center}
.step2.done .dot{background:var(--ok)}
.step2.run .dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.step2 .t{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:7px 13px;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button:hover{color:var(--ink)}
.note{border:1px dashed var(--line);border-radius:var(--r);padding:11px 14px;font-size:12.5px;color:var(--ink-2);background:var(--raised)}
.split{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .brand{border:none;flex:none} .navgrp{display:flex;align-items:center;gap:6px;padding:8px}
  .navgrp>h4{display:none} .nav{flex-direction:row} .nav button i{display:none}
  .railfoot{display:none} main{padding:18px 16px 60px} .verdict{grid-template-columns:1fr}
}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 13.5 9.5 3l7 5.5L20 17l-6.5 4L5 18.5Z" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9.5 3 11 11l-4.2 3.2L13.5 21" stroke="var(--ink-4)" stroke-width="1" stroke-linejoin="round"/>
        <circle cx="17.6" cy="6.4" r="1.5" fill="var(--s2)"/>
      </svg>
      <div><b>燧石 Flint</b><span>EVIDENCE FIRST</span></div>
    </div>
    <div id="nav"></div>
    <div class="railfoot">原型 · 演示数据<br>2026-08-12</div>
  </aside>

  <div>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="sp"></div>
      <span class="demochip">演示数据</span>
      <button class="chipbtn" id="regionbtn">中国大陆</button>
      <button class="chipbtn">中文</button>
      <button class="chipbtn">林 · 个人版</button>
    </div>
    <main id="view"></main>
  </div>
</div>

<script>
/* ============================== 演示数据 ============================== */
const SRC = [
  {k:"gtrends", n:"Google 趋势", c:"var(--s1)"},
  {k:"weibo",   n:"微博热搜",    c:"var(--s2)"},
  {k:"ghtrend", n:"GitHub",     c:"var(--s3)"},
  {k:"arxiv",   n:"arXiv",      c:"var(--s4)"},
];

const CLUSTERS = [
  {id:"clu-0417", zh:"固态电池中试线", en:"Solid-state battery pilot line", heat:154, pct:98,
   flags:["mom"], first:"2025-11-02", src:[71,154,38,26], region:"CN",
   note:"7 日归一化涨幅 +34，四源三源同向"},
  {id:"clu-0231", zh:"具身智能操作策略", en:"Embodied manipulation policy", heat:141, pct:96,

const $ = s => document.querySelector(s);

function cite(id, label){
  return `<button class="cite" data-cite="${id}" aria-expanded="false">${label||id}</button>`;
}
function srcbars(v){
  const m = Math.max(...v,1);
  return `<div class="srcbars">${v.map((x,i)=>
    `<i style="height:${Math.max(8,x/m*100)}%;background:${SRC[i].c}"></i>`).join("")}</div>`;
}
function legend(){
  return `<div class="srcleg">${SRC.map(s=>`<span><s style="background:${s.c}"></s>${s.n}</span>`).join("")}</div>`;
}
function area(series, w=560, h=150){
  const keys = Object.keys(series);
  const all = keys.flatMap(k=>series[k]); const max = Math.max(...all)*1.1;
  const n = series[keys[0]].length;
  const X = i => 34 + i*(w-46)/(n-1);
  const Y = v => h-22 - v/max*(h-40);
  let g = "";
  for(let i=0;i<=4;i++){ const y = h-22 - i*(h-40)/4;
    g += `<line x1="34" x2="${w-12}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="1"/>
          <text x="26" y="${y+3}" text-anchor="end" font-size="8.5" fill="var(--ink-4)"
          font-family="var(--mono)">${Math.round(max*i/4)}</text>`; }
  keys.forEach((k,ki)=>{
    const c = SRC.find(s=>s.k===k).c; const d = series[k];
    const line = d.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    g += `<path d="${line} L${X(n-1)},${h-22} L${X(0)},${h-22}Z" fill="${c}" opacity=".07"/>
          <path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="${X(n-1)}" cy="${Y(d[n-1])}" r="2.8" fill="${c}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"
    aria-label="四源 15 日归一化曲线">${g}
    <text x="34" y="${h-6}" font-size="8.5" fill="var(--ink-4)" font-family="var(--mono)">07-29</text>
    <text x="${w-12}" y="${h-6}" text-anchor="end" font-size="8.5" fill="var(--ink-4)" font-family="var(--mono)">08-12</text>
  </svg>`;
}
function hcard(c, opts={}){
  return `<article class="hcard">
    <div>
      <div class="between"><div class="native">${c.zh}</div>
        <button class="chipbtn" style="padding:2px 7px;font-size:11px">${opts.fav?"已收藏":"收藏"}</button></div>
      <div class="trans">${c.en}<span class="mt">机翻</span></div>
    </div>
    <div class="heat"><b>${c.heat}</b><span>综合热度 · 派生</span>
      <span class="num" style="margin-left:auto;color:var(--ink-3)">P${c.pct}</span></div>
    ${srcbars(c.src)}${legend()}
    <div class="row" style="gap:5px">
      ${c.flags.map(f=>`<span class="tag ${FLAG[f][1]}">${FLAG[f][0]}</span>`).join("")}
      <span class="tag">首见 ${c.first}</span>
    </div>
    ${c.note?`<p class="small muted">${c.note}</p>`:""}
    <div class="row" style="gap:6px;margin-top:auto">
      <button class="btn small" data-go="evidence">证据卡</button>
      <button class="btn small" data-go="graph">加入工作台</button>
    </div>
  </article>`;
}

  location.hash = k;
  $("#view").innerHTML = `<div class="screen">${S[k].render()}</div>`;
  $("#crumb").innerHTML = `${S[k].g} <b>${S[k].n}</b> <span style="color:var(--ink-4)">· ${
    String(ORDER.indexOf(k)+1).padStart(2,"0")} / ${ORDER.length}</span>`;
  document.querySelectorAll("[data-nav]").forEach(b=>
    b.setAttribute("aria-current", b.dataset.nav===k ? "true" : "false"));
  window.scrollTo({top:0,behavior:"instant"});
}
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]"); if(nav) return go(nav.dataset.nav);
  const jump = e.target.closest("[data-go]"); if(jump) return go(jump.dataset.go);

  const c = e.target.closest("[data-cite]");
  if(c){
    const open = c.getAttribute("aria-expanded")==="true";
    document.querySelectorAll(".citebody").forEach(n=>n.remove());
    document.querySelectorAll("[data-cite]").forEach(n=>n.setAttribute("aria-expanded","false"));
    if(open) return;
    c.setAttribute("aria-expanded","true");
    const d = CITES[c.dataset.cite]; if(!d) return;
    const box = document.createElement("div");
    box.className = "citebody";
    box.innerHTML = `<b>${c.dataset.cite}</b> · ${esc(d.t)}
      <q>${esc(d.q)}</q>
      <div class="row small" style="gap:12px;color:var(--ink-3)">
        <span class="num">${esc(d.u)}</span><span class="num">${d.d}</span>
        <span>强度 ${d.s}</span><span>${d.a}</span></div>`;
    (c.closest("p,td,div,span")||c).after(box);
    box.scrollIntoView({block:"nearest",behavior:"smooth"});
    return;
  }
  const region = e.target.closest("[data-region]");
  if(region){
    document.querySelectorAll("[data-region]").forEach(b=>b.removeAttribute("style"));
    region.style.cssText="border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)";
    $("#regionbtn").textContent = region.textContent;
    return;
  }
  if(e.target.id==="playjob") playJob();
});
function playJob(){
  const rows = [...document.querySelectorAll("#steps .step2")];
  rows.forEach(r=>{ r.className="step2"; r.children[2].textContent="—"; r.children[3].textContent="—"; });
  let i = 0;
  const tick = ()=>{
    if(i>0) { rows[i-1].className="step2 done";
      rows[i-1].children[2].textContent = JOBSTEPS[i-1][2];
      rows[i-1].children[3].textContent = JOBSTEPS[i-1][3]; }
    if(i>=JOBSTEPS.length) return;
    rows[i].className="step2 run"; i++;
    setTimeout(tick, 520);
  };
  tick();
}
buildNav();
go(location.hash.slice(1) || "plaza");
window.addEventListener("hashchange", ()=>go(location.hash.slice(1)));
</script>
