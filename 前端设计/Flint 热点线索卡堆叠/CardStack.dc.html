<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/fonts/fonts.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/tokens/colors.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/tokens/typography.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/tokens/texture.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/tokens/base.css">
  <link rel="stylesheet" href="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/styles.css">
  <script src="_ds/flint-design-system-8fd95ba3-cf31-49b6-b9d8-c863f3dc2724/_ds_bundle.js"></script>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 64px; box-sizing: border-box;">
  <header style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 32px; text-align: center;">
    <span style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--ink-3);">FLINT · LEADS</span>
    <h1 style="margin: 0; font-family: var(--font-display); font-weight: 400; font-size: var(--fs-31); line-height: 1.15; color: var(--ink);">今日热点线索</h1>
    <p style="margin: 0; font-size: var(--fs-14); line-height: 1.6; color: var(--ink-2);">5 条线索待浏览 · 拖拽或用方向键切换</p>
  </header>
  <div style="position: relative; width: 100%; max-width: 1040px;">
    <div tabIndex="0" onKeyDown="{{ onKeyDown }}" onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" style="position: relative; width: 100%; height: 420px; outline: none; perspective: 1100px;">
      <sc-for list="{{ cards }}" as="card" hint-placeholder-count="3">
        <div style="{{ card.posStyle }}" onClick="{{ card.select }}" onPointerDown="{{ card.onPointerDown }}">
          <article style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 24px; background-color: var(--surface); background-image: var(--tex-paper); border: 1px solid var(--rule); border-radius: var(--r-card); box-shadow: var(--shadow-sticker);">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
              <x-import component-from-global-scope="FlintDesignSystem_8fd95b.StickerTag" tone="{{ card.tagTone }}" rotate="{{ card.tagRotate }}" hint-size="90px,25px">{{ card.tag }}</x-import>
              <x-import component-from-global-scope="FlintDesignSystem_8fd95b.StatusMark" status="{{ card.status }}" hint-size="70px,25px"></x-import>
            </div>
            <h2 style="margin: 20px 0 0; font-size: var(--fs-20); line-height: 1.4; font-weight: 600; color: var(--ink);">{{ card.title }}</h2>
            <p style="margin: 8px 0 0; font-size: var(--fs-14); line-height: 1.6; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{ card.description }}</p>
            <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; line-height: 1.6; color: var(--ink-3);">
              <span>{{ card.id }}</span>
              <span>{{ card.time }}</span>
              <span style="margin-left: auto;">事实 {{ card.facts }} 条</span>
            </div>
          </article>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px;">
      <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="5">
        <button onClick="{{ dot.select }}" aria-label="{{ dot.label }}" style="{{ dot.style }}" style-hover="background: var(--ink-3);"></button>
      </sc-for>
    </div>
    <p style="margin: 16px 0 0; text-align: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; color: var(--ink-3);">{{ counter }} · 点击侧卡或拖拽当前卡切换</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 800}, &quot;spreadDeg&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 48, &quot;min&quot;: 0, &quot;max&quot;: 90, &quot;step&quot;: 2, &quot;unit&quot;: &quot;deg&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;扇形几何&quot;}, &quot;overlap&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.48, &quot;min&quot;: 0.2, &quot;max&quot;: 0.7, &quot;step&quot;: 0.02, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;扇形几何&quot;}, &quot;autoAdvance&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;轮播&quot;}, &quot;intervalMs&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 2800, &quot;min&quot;: 700, &quot;max&quot;: 10000, &quot;step&quot;: 100, &quot;unit&quot;: &quot;ms&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;轮播&quot;}}">
class Component extends DCLogic {
  state = { active: 0, dragX: 0, dragging: false };
  data = [
    { id: "CL-0801-01", tag: "SOURCE · 36氪", tagTone: "indigo", status: "verified", title: "国产固态电池中试线宣布量产时间表", description: "三家头部厂商同日释放量产节点，供应链侧尚无对应扩产信号，需核对招标记录。", time: "08-01 06:40", facts: 3 },
    { id: "CL-0801-02", tag: "SOURCE · 财新", tagTone: "paper", status: "review", title: "跨境支付新规征求意见稿流出", description: "文本来源为第三方转载，原始发文机关页面未检索到对应文号。", time: "08-01 07:05", facts: 1 },
    { id: "CL-0801-03", tag: "SOURCE · Reuters", tagTone: "indigo", status: "verified", title: "东南亚数据中心电价补贴政策落地", description: "两国官方公报已确认，补贴口径与早前市场传闻存在差异。", time: "08-01 07:30", facts: 4 },
    { id: "CL-0801-04", tag: "SOURCE · 微博热搜", tagTone: "sulfur", status: "disputed", title: "某车企\u201c城市NOA全量推送\u201d说法遭多方质疑", description: "官方口径与用户实测范围不一致，双方证据均已归档，等待复核。", time: "08-01 08:12", facts: 2 },
    { id: "CL-0801-05", tag: "SOURCE · 行业群", tagTone: "paper", status: "speculative", title: "传头部大模型厂商将拆分芯片团队", description: "此段为推测，无证据支持，不提供溯源。", time: "08-01 08:40", facts: 0 },
  ];
  componentDidMount() {
    this.reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.lastAdvance = Date.now();
    this.timer = setInterval(() => {
      if (!(this.props.autoAdvance ?? false) || this.reduceMotion || this.hovering || this.state.dragging) return;
      const iv = Math.max(700, this.props.intervalMs ?? 2800);
      if (Date.now() - this.lastAdvance >= iv) this.go(1);
    }, 150);
    this.onMove = (e) => {
      if (!this.state.dragging) return;
      const now = Date.now();
      this.vel = (e.clientX - this.lastX) / Math.max(1, now - this.lastT) * 1000;
      this.lastX = e.clientX; this.lastT = now;
      this.setState({ dragX: e.clientX - this.startX });
    };
    this.onUp = () => {
      if (!this.state.dragging) return;
      const dx = this.state.dragX, v = this.vel || 0;
      const threshold = Math.min(160, 520 * 0.22);
      this.setState({ dragging: false, dragX: 0 });
      if (dx > threshold || v > 650) this.go(-1);
      else if (dx < -threshold || v < -650) this.go(1);
    };
    window.addEventListener("pointermove", this.onMove);
    window.addEventListener("pointerup", this.onUp);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    window.removeEventListener("pointermove", this.onMove);
    window.removeEventListener("pointerup", this.onUp);
  }
  wrap(n) { const len = this.data.length; return ((n % len) + len) % len; }
  go(d) { this.lastAdvance = Date.now(); this.setState((s) => ({ active: this.wrap(s.active + d), dragX: 0 })); }
  goTo(i) { this.lastAdvance = Date.now(); this.setState({ active: i, dragX: 0 }); }
  renderVals() {
    const { active, dragX, dragging } = this.state;
    const len = this.data.length;
    const spreadDeg = this.props.spreadDeg ?? 48;
    const overlap = this.props.overlap ?? 0.48;
    const cardW = 520, cardH = 320, maxOffset = 2;
    const spacing = Math.max(10, Math.round(cardW * (1 - overlap)));
    const stepDeg = spreadDeg / 3;
    const cards = this.data.map((d, i) => {
      let off = i - active;
      if (len > 1) { const alt = off > 0 ? off - len : off + len; if (Math.abs(alt) < Math.abs(off)) off = alt; }
      const abs = Math.abs(off);
      const isActive = off === 0;
      const hidden = abs > maxOffset;
      const x = off * spacing + (isActive ? dragX : 0);
      const y = abs * 10 + (isActive ? -22 : 0);
      const scale = isActive ? 1.03 : 0.94;
      const posStyle = {
        position: "absolute", left: "50%", bottom: 0, width: cardW, height: cardH,
        marginLeft: -cardW / 2, zIndex: 100 - abs,
        transform: `translateX(${x}px) translateY(${y}px) translateZ(${-abs * 140}px) rotateZ(${off * stepDeg}deg) rotateX(${isActive ? 0 : 12}deg) scale(${scale})`,
        transformStyle: "preserve-3d",
        opacity: hidden ? 0 : 1,
        pointerEvents: hidden ? "none" : "auto",
        cursor: isActive ? (dragging ? "grabbing" : "grab") : "pointer",
        userSelect: "none", touchAction: "pan-y",
        transition: dragging && isActive ? "none" : "transform .55s cubic-bezier(.22,.9,.3,1.08), opacity .4s ease",
        willChange: "transform",
      };
      return {
        ...d, posStyle,
        tagRotate: (i % 2 ? 1 : -1) * (0.6 + (i % 3) * 0.4),
        select: () => { if (!isActive && Math.abs(this.state.dragX) < 4) this.goTo(i); },
        onPointerDown: isActive ? (e) => {
          if (this.reduceMotion) return;
          e.preventDefault();
          this.startX = e.clientX; this.lastX = e.clientX; this.lastT = Date.now(); this.vel = 0;
          this.setState({ dragging: true, dragX: 0 });
        } : undefined,
      };
    });
    const dots = this.data.map((d, i) => ({
      label: `跳到 ${d.id}`,
      select: () => this.goTo(i),
      style: {
        width: 8, height: 8, padding: 0, border: "none", borderRadius: 0, cursor: "pointer",
        background: i === active ? "var(--indigo)" : "var(--rule)",
        transform: i === active ? "rotate(0deg)" : "rotate(45deg) scale(.8)",
        transition: "background .2s ease, transform .3s ease",
      },
    }));
    return {
      cards, dots,
      counter: `${String(active + 1).padStart(2, "0")} / ${String(len).padStart(2, "0")}`,
      onKeyDown: (e) => { if (e.key === "ArrowLeft") this.go(-1); if (e.key === "ArrowRight") this.go(1); },
      onEnter: () => { this.hovering = true; },
      onLeave: () => { this.hovering = false; },
    };
  }
}
</script>
</body>
</html>
